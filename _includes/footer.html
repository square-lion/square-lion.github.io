<footer>
	<ul class="social-links">
	{% for link in site.data.social %}
		<li>
		<a href="{{ link.url }}" 
			aria-label="{{ link.name }}" 
			target="_blank" 
			rel="noopener noreferrer">
			<span class="icon icon--{{ link.icon }}" aria-hidden="true"></span>
			{{ link.name }}
		</a>
		</li>
	{% endfor %}
	</ul>
</footer>
