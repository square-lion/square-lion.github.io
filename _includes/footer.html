<div class="container">
	<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
		<div class="col-md-4 d-flex align-items-center">
			<a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
				<img class="footer-logo" src="/assets/images/square-lion/logo.png">
			</a>
			<span class="mb-3 mb-md-0 text-body-secondary">© 2026 Square Lion, LLC</span>
		</div>
		
		<ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
		{% for link in site.data.socials %}
			<li class="ms-3">
				<a class="text-body-secondary" href="{{ link.url }}">
					<i class="fa-brands fa-{{ link.icon }}"></i>
				</a>
			</li>
		{% endfor %}
		</ul>
	</footer>
</div>
