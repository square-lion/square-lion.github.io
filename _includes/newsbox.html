<div class="col-lg-4 col-md-6 col-sm-12">
	<div class="card shadow-sm"><img class="img-fluid rounded-top" src="{{ include.news.image }}">
		<div class="card-body">
			<p class="card-text"><strong>{{ include.news.title }}</strong><br>{{ include.news.body }}</p>
			<div class="d-flex justify-content-between align-items-center">
				<small class="text-body-secondary">{{ include.news.date }}</small>
			</div>
		</div>
	</div>
</div>
